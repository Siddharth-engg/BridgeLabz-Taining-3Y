<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card{
            width: 350px;
            background-color: white;
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgb(202, 25, 25);
        }

        .circle{
            width: 120px;
            height: 120px;
            background-color: #b15656;
            border-radius: 50%;
            margin: auto;
            line-height: 120px;
            font-size: 22px;
        }

        h1{
            margin-top: 20px;
        }

        .branch{
            font-size: 24px;
            font-weight: bold;
        }

        .college{
            font-size: 20px;
            color: rgb(13, 14, 14);
        }

        p{
            font-size: 20px;
            line-height: 1.6;
        }

        .skills{
            font-weight: bold;
            font-size: 24px;
        }

        button{
            background-color: rgb(78, 235, 151);
            color: rgb(144, 85, 85);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
      <div class="profile">
    <img src="sid.jpg" alt="Student Photo" width="120" height="120">
</div>
        <h1>Siddharth Singh</h1>

        <div class="branch">Computer Science Engineering</div>

        <div class="college">GLA Institute of Technology</div>

        <p>
            I am currently learning development along with making a strong command in dsa.
        </p>

        <div class="skills">Skills</div>

        <p>HTML, Python, Java, Problem Solving</p>

        <button>Contact Me</button>
    </div>

</body>
</html>
