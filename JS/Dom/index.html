


<!DOCTYPE html>
<html>
<head>
    <title>Decrement Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 id="count">0</h2>

    <button onclick="decrement()">Decrement (-)</button>

    <script>
        let count = 0;

        function decrement() {
            count--;
            document.getElementById("count").innerText = count;
        }
    </script>
    <script src="script.js"></script>

</body>
</html>
