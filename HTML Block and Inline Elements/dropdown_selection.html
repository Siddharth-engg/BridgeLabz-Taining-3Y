<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>
<body>

<h1>Travel Selection Form</h1>

<form>

    <label>Country:</label>
    <select>
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
    </select>

    <br><br>

    <label>State:</label>
    <select>
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <label>City:</label>
    <select>
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
    </select>

    <br><br>

    <label>Favorite Tourist Place:</label>
    <select>
        <option selected>Taj Mahal</option>
        <option>India Gate</option>
        <option>Gateway of India</option>
    </select>

</form>

<p>
    Selected Country: India, State: Uttar Pradesh,
    City: Mathura, Favorite Tourist Place: Taj Mahal.
</p>

</body>
</html>
