<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>

    <h1>Online Store Product Catalog</h1>

    <table border="1">
        <tr>
            <th colspan="5">Available Products</th>
        </tr>

        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td rowspan="1">
                <img src="laptop.jpg" alt="Laptop" width="100">
            </td>
            <td>Laptop</td>
            <td>High-performance laptop for students.</td>
            <td>₹55,000</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td>
                <img src="phone.jpg" alt="Smartphone" width="100">
            </td>
            <td>Smartphone</td>
            <td>Latest Android smartphone.</td>
            <td>₹25,000</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td>
                <img src="headphone.jpg" alt="Headphones" width="100">
            </td>
            <td>Headphones</td>
            <td>Wireless noise-cancelling headphones.</td>
            <td>₹4,000</td>
            <td>Out of Stock</td>
        </tr>
    </table>

</body>
</html>
