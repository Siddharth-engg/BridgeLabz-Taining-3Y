<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <h1>My City on Google Maps</h1>

    <!-- loading="lazy" tells the browser to load the map only when it is close to being visible on the screen. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,India&output=embed"
        title="Google Map showing Mathura, India"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
