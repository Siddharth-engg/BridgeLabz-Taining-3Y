<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <section class="pricing">

        <div class="card">

            <h2>Basic</h2>

            <h3>₹499</h3>

            <p>Per Month</p>

            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <button>Choose Plan</button>

        </div>


        <div class="card popular">

            <h2>Premium</h2>

            <h3>₹999</h3>

            <p>Per Month</p>

            <ul>
                <li>Unlimited Projects</li>
                <li>50 GB Storage</li>
                <li>Priority Support</li>
            </ul>

            <button>Choose Plan</button>

        </div>


        <div class="card">

            <h2>Pro</h2>

            <h3>₹1499</h3>

            <p>Per Month</p>

            <ul>
                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <button>Choose Plan</button>

        </div>

    </section>

</body>
</html>
